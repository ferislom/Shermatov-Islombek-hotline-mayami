  else{if(d>230||!v)mv(e,ex/d*100*dt,ey/d*100*dt,10);else if(d<150)mv(e,-ex/d*90*dt,-ey/d*90*dt,10);

 for(let i=bl.length-1;i>=0;i--){const b=bl[i];let rm=0;

   if(isW(b.x,b.y))rm=1;
   else if(b.o){for(const e of en)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<12){kill(e);rm=1;break}}
   else if(Math.hypot(p.x-b.x,p.y-b.y)<11){die();rm=1}}
  b.l-=dt;if(rm||b.l<=0)bl.splice(i,1)}
 cl=!mp&&en.every(e=>e.dead);
 if(cl&&Math.hypot(p.x-sx0,p.y-sy0)<26){sc+=500;sfx('pick');if(lv+1<3)load(lv+1);else st='win'}
}

  g.globalAlpha=.5+.5*(1-b);tx('нажми любую клавишу или кликни',W/2,H/2+120,Math.min(W/40,16),'#fff','center');g.globalAlpha=1;return}
 cam();const pal=PAL[lv%3],b=(t%560)/560;
 g.save();g.translate((-camX+(Math.random()-.5)*shake)|0,(-camY+(Math.random()-.5)*shake)|0);

  else{g.fillStyle=(x+y)%2?'#1c0f38':'#23134a';g.fillRect(x*T,y*T,T,T);g.globalAlpha=.06*(1-b);g.fillStyle=pal[1];g.fillRect(x*T,y*T,T,T);g.globalAlpha=1}}

 if(cl){g.strokeStyle='#8cff3e';g.lineWidth=3;g.globalAlpha=.5+.5*(1-b);g.beginPath();g.arc(sx0,sy0,18+8*b,0,6.3);g.stroke();g.globalAlpha=1}
 for(const e of en){if(e.dead){g.fillStyle='#7a1250';g.beginPath();g.ellipse(e.x,e.y,13,8,e.a,0,6.3);g.fill();continue}
  g.fillStyle=e.t==='G'?'#b04dff':'#ff7a3e';g.beginPath();g.arc(e.x,e.y,10,0,6.3);g.fill();
  g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.a)*(e.t==='G'?20:16),e.y+Math.sin(e.a)*(e.t==='G'?20:16));g.stroke();

  else{g.fillStyle='#7a1250';g.beginPath();g.ellipse(o.rx,o.ry,13,8,o.a,0,6.3);g.fill()}}
 if(st!=='dead'){g.shadowColor='#2f7bff';g.shadowBlur=14;g.fillStyle='#2f7bff';g.beginPath();g.arc(p.x,p.y,10,0,6.3);g.fill();g.shadowBlur=0;
  g.strokeStyle='#fff';g.lineWidth=p.w==='bat'?5:3;const L=p.w==='bat'?26:(p.w==='fists'?14:22);
  g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+Math.cos(p.a)*L,p.y+Math.sin(p.a)*L);g.stroke();

/* звук */
let ac,mute=0,stp=0;
function au(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();setInterval(mus,140)}if(ac.state==='suspended')ac.resume()}
function tone(f,d,ty,v,sl){if(!ac||mute)return;const o=ac.createOscillator(),n=ac.createGain(),c=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,c);if(sl)o.frequency.exponentialRampToValueAtTime(sl,c+d);n.gain.setValueAtTime(v,c);n.gain.exponentialRampToValueAtTime(.001,c+d);o.connect(n).connect(ac.destination);o.start();o.stop(c+d)}
const BASS=[55,55,82.4,55,65.4,65.4,98,65.4];
function mus(){if(st!=='play')return;const n=BASS[stp%8];if(stp%2==0)tone(n,.2,'sawtooth',.06);if(stp%4==0)tone(130,.12,'sine',.18,40);if(stp%2==1)tone(n*8,.05,'square',.015);stp++}
function sfx(k){({gun:()=>tone(300,.15,'sawtooth',.2,60),gun2:()=>tone(200,.15,'square',.1,50),hit:()=>tone(180,.12,'square',.15,40),swing:()=>tone(500,.08,'triangle',.08,150),die:()=>tone(220,.5,'sawtooth',.2,30),pick:()=>tone(600,.1,'square',.08,1000)})[k]()}
/* ввод */
function restart(){if(st==='dead'&&!mp){sc=lvSc;load(lv)}}
function startAny(){if(st==='win'){st='title';showMenu(1)}}
addEventListener('keydown',e=>{au();K[e.code]=1;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(st==='title'||st==='win'){startAny();return}
 if(e.code==='KeyE')pick();
 if(e.code==='KeyR'&&!mp){if(st==='play'){sc=lvSc;load(lv)}else restart()}
 if(e.code==='Space')restart();
 if(e.code==='KeyM')mute=!mute});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
cv.addEventListener('mousedown',e=>{au();mx=e.clientX;my=e.clientY;
 if(st==='title'||st==='win'){startAny();return}
 if(st==='dead'){restart();return}
 if(e.button===2)pick();else down=true});
addEventListener('mouseup',()=>down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());

const $=id=>document.getElementById(id);

function msg(x){$('msg').textContent=x}
function send(d){if(conn&&conn.open)conn.send(d)}
function setRt(){rt=(ms[0]>=5||ms[1]>=5)?4:2.2}
function spawnMe(){load(3);if(!host){p.x=sx1;p.y=sy1}opp.alive=1;opp.rx=undefined}
function newRound(){if(ms[0]>=5||ms[1]>=5)ms=[0,0];spawnMe()}
function begin(){mp=1;ms=[0,0];rt=0;showMenu(0);spawnMe()}
function onData(d){
 if(d.t==='st'){Object.assign(opp,{x:d.x,y:d.y,a:d.a,w:d.w,sw:d.sw})}
 else if(d.t==='s'){const n=d.w==='shotgun'?6:1,s=d.w==='shotgun'?.2:.03;for(let i=0;i<n;i++)shoot(d.x,d.y,d.a+(Math.random()-.5)*s*2,820,0);sfx('gun2')}
 else if(d.t==='m'){if(st==='play'&&Math.hypot(p.x-d.x,p.y-d.y)<d.r+10&&Math.abs(angd(d.a,Math.atan2(p.y-d.y,p.x-d.x)))<1)die()}
 else if(d.t==='d'){ms[0]++;opp.alive=0;setRt();sfx('hit')}}
function setup(){if(conn.open)begin();else conn.on('open',begin);conn.on('data',onData);
 conn.on('close',()=>{mp=0;conn=null;st='title';showMenu(1);msg('Соперник вышел')})}
$('b1').onclick=()=>{au();mp=0;sc=0;showMenu(0);load(0)};
$('b2').onclick=()=>{au();host=1;peer&&peer.destroy();const code=Math.random().toString(36).slice(2,6).toUpperCase();msg('Создаём комнату…');
 peer=new Peer('nsweep-'+code);
 peer.on('open',()=>msg('Код комнаты: '+code+' — отправь другу и жди'));
 peer.on('connection',c=>{conn=c;setup()});
 peer.on('error',e=>msg('Ошибка: '+e.type+' (нажми ещё раз)'))};
$('b3').onclick=()=>{au();host=0;const code=$('code').value.trim().toUpperCase();if(code.length<4)return msg('Введи 4 символа кода');
 peer&&peer.destroy();msg('Подключаемся…');peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('nsweep-'+code,{reliable:true});setup()});
 peer.on('error',e=>msg(e.type==='peer-unavailable'?'Комната не найдена':'Ошибка: '+e.type))};
$('pk').addEventListener('pointerdown',e=>{e.preventDefault();pick()});
/* сенсорное управление: слева — движение, справа — прицел и атака */
function tUp(){jx=jy=0;down=false;for(const k in tc){const o=tc[k],dx=o.x-o.x0,dy=o.y-o.y0,d=Math.hypot(dx,dy);
 if(o.s==='L'&&d>8){jx=dx/d;jy=dy/d}
 if(o.s==='R'&&d>14){mx=W/2+dx/d*100;my=H/2+dy/d*100;down=true}}}
cv.addEventListener('touchstart',e=>{e.preventDefault();au();
 if(st==='win'){startAny();return}if(st==='dead'&&!mp){restart();return}
 for(const t of e.changedTouches)tc[t.identifier]={s:t.clientX<W/2?'L':'R',x0:t.clientX,y0:t.clientY,x:t.clientX,y:t.clientY};tUp()},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const o=tc[t.identifier];if(o){o.x=t.clientX;o.y=t.clientY}}tUp()},{passive:false});
const tend=e=>{for(const t of e.changedTouches)delete tc[t.identifier];tUp()};
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(st==='play')upd(dt);
 if(mp){if(rt>0){rt-=dt;if(rt<=0)newRound()}if(t-lastSend>50){lastSend=t;send({t:'st',x:p.x|0,y:p.y|0,a:+p.a.toFixed(2),w:p.w,sw:p.sw>0?1:0})}}
 draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body></html>
